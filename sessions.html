<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Auth OS | Sessions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --cyan:#20E6FF; --yellow:#FFD166; --red:#FF3B5C; }
        body { margin:0; background:#050A14; color:#D7F8FF; font-family:Inter, ui-sans-serif, system-ui, sans-serif; }
        .shell { display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
        .sidebar { background:rgba(5,10,20,.96); border-right:1px solid rgba(32,230,255,.2); }
        .nav { display:block; border:1px solid rgba(32,230,255,.18); background:rgba(32,230,255,.04); color:#B9F7FF; transition:.22s; }
        .nav:hover, .nav.active { transform:translateX(5px); border-color:rgba(32,230,255,.6); background:rgba(32,230,255,.12); }
        .panel { background:rgba(7,16,31,.84); border:1px solid rgba(32,230,255,.22); box-shadow:0 0 28px rgba(32,230,255,.08); }
        .live { animation:blink 1s infinite; box-shadow:0 0 16px #42FF9E; }
        @keyframes blink { 50% { opacity:.25; } }
        tr { transition:.2s; }
        tr:hover { background:rgba(32,230,255,.06); }
        .terminate { border:1px solid rgba(255,59,92,.45); color:#FF8BA0; transition:.2s; }
        .terminate:hover { background:rgba(255,59,92,.14); box-shadow:0 0 18px rgba(255,59,92,.2); }
        @media (max-width:900px){ .shell{grid-template-columns:1fr}.content{padding:18px!important} }
    </style>
</head>
<body>
    <div class="shell">
        <aside class="sidebar p-6">
            <div class="text-cyan-300 font-black tracking-[.28em] text-sm mb-10">SECURE AUTH OS</div>

            <nav class="space-y-3">
                <a class="nav rounded-xl px-4 py-3 font-bold" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav active rounded-xl px-4 py-3 font-bold" href="{{ url_for('sessions_page') }}">Active Sessions</a>
                <a class="nav rounded-xl px-4 py-3 font-bold" href="{{ url_for('logs_page') }}">Security Logs</a>
                <a class="nav rounded-xl px-4 py-3 font-bold" href="{{ url_for('profile') }}">Profile</a>
            </nav>
        </aside>

        <main class="content p-7 space-y-6">
            <header class="panel rounded-3xl p-5 flex flex-wrap items-center justify-between gap-4">
                <div>
                    <div class="text-xs text-cyan-300/70 uppercase tracking-[.28em]">Active Sessions</div>
                    <h1 class="text-3xl font-black text-white">Session Control Plane</h1>
                </div>

                <div class="flex items-center gap-3 rounded-full border border-green-300/30 bg-green-300/10 px-4 py-2">
                    <span class="live w-3 h-3 rounded-full bg-green-300"></span>
                    <span class="font-black text-green-200 tracking-widest">LIVE</span>
                </div>
            </header>

            <section class="panel rounded-3xl p-5 overflow-auto">
                <table class="w-full min-w-[860px] text-sm">
                    <thead class="text-cyan-300/70 uppercase tracking-widest text-xs">
                        <tr>
                            <th class="text-left p-4">Status</th>
                            <th class="text-left p-4">Session ID</th>
                            <th class="text-left p-4">User</th>
                            <th class="text-left p-4">IP</th>
                            <th class="text-left p-4">Login Time</th>
                            <th class="text-left p-4">Expiry</th>
                            <th class="text-left p-4">Action</th>
                        </tr>
                    </thead>

                    <tbody id="sessionRows"></tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        function row(session) {
            return `
                <tr>
                    <td class="p-4">
                        <span class="inline-flex items-center gap-2 text-green-200 font-black">
                            <span class="live w-2 h-2 rounded-full bg-green-300"></span>
                            ${session.status}
                        </span>
                    </td>
                    <td class="p-4 font-mono text-cyan-200">${session.id}</td>
                    <td class="p-4">${session.user}</td>
                    <td class="p-4">${session.ip}</td>
                    <td class="p-4 text-cyan-100/70">${session.login_time}</td>
                    <td class="p-4 text-cyan-100/70">${session.expiry}</td>
                    <td class="p-4">
                        <form method="POST" action="/terminate/${session.id}">
                            <button class="terminate rounded-xl px-4 py-2 font-black">Terminate</button>
                        </form>
                    </td>
                </tr>
            `;
        }

        async function refreshSessions() {
            const res = await fetch("{{ url_for('api_sessions') }}");
            const data = await res.json();

            document.getElementById('sessionRows').innerHTML = data.sessions.length
                ? data.sessions.map(row).join('')
                : '<tr><td colspan="7" class="p-6 text-center text-cyan-100/50">No active sessions detected.</td></tr>';
        }

        refreshSessions();
        setInterval(refreshSessions, 4000);
    </script>
</body>
</html>
